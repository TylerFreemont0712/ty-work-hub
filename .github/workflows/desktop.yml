name: Desktop checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
      TY_WORK_APP_HOME: ${{ github.workspace }}/.test-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 fonts-noto-core subversion
      - name: Python dependencies
        run: python -m pip install -r requirements.txt ruff
      - run: python -m ruff check .
      - run: python -m tests.git_integration
      - run: python -m tests.rewrite_smoke
      - run: python -m tests.ui_smoke
      - run: python -m tests.svn_smoke
      - name: Real SVN repository
        if: runner.os == 'Linux'
        run: python -m tests.svn_integration
